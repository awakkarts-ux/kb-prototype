<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>База — прототип</title>
<style>
:root{
  --bg:#f4f4f3; --panel:#ffffff; --side:#ececea; --line:#dcdcd8; --line2:#c9c9c4;
  --text:#1c1c1b; --muted:#6b6b67; --faint:#9a9a95; --hover:#e6e6e3; --accent:#1c1c1b; --accent-text:#fff;
  --r:8px; --sh:0 8px 30px rgba(0,0,0,.12);
}
:root[data-theme="dark"]{
  --bg:#161616; --panel:#1f1f1f; --side:#1a1a1a; --line:#2e2e2d; --line2:#3a3a38;
  --text:#ececea; --muted:#a3a39e; --faint:#75756f; --hover:#2a2a29; --accent:#ececea; --accent-text:#161616;
  --sh:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex}
a{color:inherit}
button{font:inherit;color:inherit}
.side{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 8px;gap:2px;height:100vh;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:8px;padding:6px 8px 12px;font-weight:600}
.brand i{width:20px;height:20px;border-radius:5px;background:var(--text);display:block}
.sbtn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;color:var(--muted)}
.sbtn:hover{background:var(--hover);color:var(--text)}
.sbtn.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.sbtn .cnt{margin-left:auto;font-size:12px;color:var(--faint)}
.sbtn kbd,.kbd{margin-left:auto;font:11px/1 system-ui;border:1px solid var(--line2);border-radius:4px;padding:3px 5px;color:var(--faint)}
.sbtn.dis{opacity:.5}
.sep{height:1px;background:var(--line);margin:8px 6px}
.sfoot{margin-top:auto;font-size:12px;color:var(--faint);padding:8px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3aa55d;margin-right:6px}
main{flex:1;min-width:0;overflow:auto;height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:24px 32px 64px}
.crumbs{font-size:12px;color:var(--faint);margin-bottom:6px}
.crumbs a{text-decoration:none;cursor:pointer}.crumbs a:hover{color:var(--text)}
h1{font-size:24px;line-height:1.2;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
h2{font-size:16px;margin:0;font-weight:600}
h3{font-size:14px;margin:0;font-weight:600}
.sub{color:var(--muted);margin:0 0 20px}
.head{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px}
.head .sub{margin:0}
.head .grow{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.pri:hover{opacity:.9}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.w{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:180px}
.w .wh{display:flex;align-items:center;gap:8px;cursor:pointer}
.w .wh:hover h2{text-decoration:underline}
.w .wh .n{color:var(--faint);font-size:13px}
.w .wh .go{margin-left:auto;color:var(--faint)}
.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:4px}
.li:first-child{border-top:0}
.li:hover{background:var(--hover)}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m{color:var(--faint);font-size:12px;white-space:nowrap}
.empty{color:var(--faint);font-size:13px;padding:8px 6px}
.st{font-size:12px;white-space:nowrap;color:var(--muted)}
.chk{width:16px;height:16px;border:1.5px solid var(--line2);border-radius:4px;flex:none;display:grid;place-items:center;cursor:pointer;background:var(--panel)}
.chk.on{background:var(--text);border-color:var(--text);color:var(--bg);font-size:11px}
.done .t{text-decoration:line-through;color:var(--faint)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--text);border-color:var(--text)}
.tab .n{color:var(--faint);font-size:12px;margin-left:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.fbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.fbtn.on{border-color:var(--text);color:var(--text)}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--faint);font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--hover)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--text)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:var(--side);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col h3{font-size:13px;color:var(--muted);padding:2px 4px}
.pc{padding:10px 12px;cursor:pointer}
.pc:hover{border-color:var(--line2)}
.pc .k{font-size:12px;color:var(--faint);margin-top:4px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.sec{padding:16px;margin-bottom:16px}
.sec h2{margin-bottom:10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--faint)}
.pipe{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:34px 1fr 190px;gap:8px;align-items:center;padding:7px 6px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .num{color:var(--faint);font-size:12px}
.step .nm{min-width:0}
.step .note{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.flash{animation:fl 1.2s}
@keyframes fl{0%{background:var(--hover)}100%{background:transparent}}
select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%}
.dec{padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.dec:first-of-type{border-top:0}
.dec b{font-weight:500;color:var(--faint);margin-right:6px}
.round{margin-bottom:16px}
.rh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.rh .grow{flex:1}
.rh .m{color:var(--faint);font-size:12px}
.rbody{padding:0 16px 14px}
.rbody table td:nth-child(1){width:34px;color:var(--faint)}
.rbody table td:nth-child(2){width:200px;color:var(--muted)}
.rbody table td:nth-child(4){width:190px}
.rfoot{display:flex;align-items:center;gap:12px;padding-top:12px}
.warn{font-size:13px;color:var(--muted)}
.kb{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.tree{padding:8px}
.tree .g{font-size:12px;color:var(--faint);padding:10px 8px 4px}
.tree .it{padding:6px 8px;border-radius:5px;cursor:pointer;font-size:13px}
.tree .it:hover{background:var(--hover)}
.tree .it.on{background:var(--hover);font-weight:500}
.page{padding:28px 32px;min-height:420px}
.page .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin:6px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.page .body p{margin:0 0 12px}
.page .body ul{margin:0 0 12px;padding-left:20px}
.page .body li{margin-bottom:4px}
.page .body[contenteditable="true"]{outline:1px dashed var(--line2);outline-offset:8px;border-radius:2px}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.ref{overflow:hidden;cursor:default}
.ref .shot{aspect-ratio:16/10;background:repeating-linear-gradient(135deg,var(--side),var(--side) 8px,var(--bg) 8px,var(--bg) 16px);display:grid;place-items:center;color:var(--faint);font-size:12px;border-bottom:1px solid var(--line)}
.ref .b{padding:10px 12px;display:flex;align-items:center;gap:8px}
.ref .b .t{flex:1;min-width:0}
.ref .b .t div:last-child{font-size:12px;color:var(--faint)}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:30px;height:28px;cursor:pointer;color:var(--faint)}
.ib.on{border-color:var(--text);color:var(--text)}
.inb{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.inb:first-child{border-top:0}
.inb .ico{width:32px;height:32px;border-radius:6px;background:var(--side);display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none}
.inb .t{flex:1;min-width:0}
.inb .t div:last-child{font-size:12px;color:var(--faint)}
.inb select{width:170px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:10}
.ov.on{display:flex}
.modal{width:min(620px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);overflow:hidden}
.modal input,.modal textarea{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:16px/1.4 system-ui;padding:16px 18px;outline:0}
.modal textarea{min-height:110px;resize:vertical;font-size:14px}
.mres{max-height:50vh;overflow:auto;padding:6px}
.mres .g{font-size:12px;color:var(--faint);padding:8px 10px 4px}
.mres .r{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;gap:10px}
.mres .r .m{margin-left:auto;color:var(--faint);font-size:12px}
.mres .r.sel,.mres .r:hover{background:var(--hover)}
.mfoot{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.mfoot .grow{flex:1;font-size:12px;color:var(--faint)}
.seg{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--sh);font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:20;max-width:380px}
.toast.on{opacity:1;transform:none}
.stub{padding:40px;text-align:center;color:var(--muted)}
.note-proto{font-size:12px;color:var(--faint);border:1px dashed var(--line2);border-radius:6px;padding:8px 10px;margin-bottom:16px}
.badge{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.badge.hot{border-color:var(--text);color:var(--text);font-weight:600}
.in{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%}
textarea.in{min-height:56px;resize:vertical;font-size:13px;line-height:1.4}
.row-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* Паспорт как документация дизайн-системы */
.doc{display:grid;grid-template-columns:180px minmax(0,1fr);gap:36px;align-items:start}
.doc-nav{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.doc-nav a{padding:5px 8px;border-radius:5px;color:var(--muted);text-decoration:none;cursor:pointer;display:flex;gap:10px}
.doc-nav a span{color:var(--faint);font:12px/1.6 ui-monospace,Consolas,monospace}
.doc-nav a:hover{background:var(--hover);color:var(--text)}
.dsec{padding:32px 0 36px;border-top:1px solid var(--line)}
.dsec:first-child{border-top:0;padding-top:4px}
.dsec .eb{font:12px/1 ui-monospace,Consolas,monospace;color:var(--faint);margin-bottom:10px}
.dsec h2{font-size:24px;font-weight:650;letter-spacing:-.01em;margin-bottom:6px}
.dsec .lead{color:var(--muted);margin:0 0 20px;max-width:640px}
.spec{display:grid;grid-template-columns:170px 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.spec>span{padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.spec>span:nth-child(-n+2){border-top:0}
.spec>span:nth-child(odd){color:var(--faint);background:var(--side)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.tile:hover{border-color:var(--line2)}
.tile .k{font-size:12px;color:var(--faint)}
/* План: график */
.gt{min-width:760px}
.gt-row{display:grid;grid-template-columns:210px 1fr 70px;align-items:center;border-bottom:1px solid var(--line)}
.gt-name{padding:9px 10px 9px 0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt-track{position:relative;height:36px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--n)) 100%}
.gt-days{display:grid;grid-template-columns:repeat(var(--n),1fr);font-size:11px;line-height:1.3;color:var(--faint);text-align:center;padding:6px 0}
.gt-days .on{color:var(--text);font-weight:650}
.gt-plan{position:absolute;top:8px;height:20px;border:1.5px dashed var(--line2);border-radius:4px}
.gt-fact{position:absolute;top:12px;height:12px;background:var(--text);border-radius:3px;opacity:.8}
.gt-fact.late{background:repeating-linear-gradient(45deg,var(--text),var(--text) 4px,var(--muted) 4px,var(--muted) 8px)}
.gt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.45}
.gt-lag{font-size:12px;text-align:right;color:var(--text);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:22px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* Календарь недели */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{padding:10px;min-height:280px;display:flex;flex-direction:column;gap:6px}
.day.off{background:var(--side);border-style:dashed}
.day.now{box-shadow:0 0 0 1.5px var(--text)}
.day .dh{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
.day .dh b{font-size:18px;color:var(--text)}
.chip{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:5px 7px;cursor:pointer;background:var(--panel);line-height:1.35}
.chip:hover{border-color:var(--line2)}
.chip .p{color:var(--faint);display:block;font-size:11px}
.chip.stg{background:transparent;border-style:dashed;color:var(--muted)}
.chip.dn{text-decoration:line-through;color:var(--faint)}
/* Холст */
.cv{position:relative;height:640px;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:22px 22px;cursor:grab;user-select:none;touch-action:none}
.cv.pan{cursor:grabbing}
.cv-in{position:absolute;left:0;top:0;transform-origin:0 0}
.cv svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.nd{position:absolute;width:220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:move}
.nd .nh{display:flex;gap:8px;align-items:center;padding:9px 12px;font-size:13px;font-weight:600}
.nd .nh .k{margin-left:auto;font-size:11px;color:var(--faint);font-weight:400;white-space:nowrap}
.nd .nb{padding:0 12px 10px;font-size:12px;color:var(--muted)}
.nd .img{aspect-ratio:16/10;background:repeating-linear-gradient(135deg,var(--side),var(--side) 8px,var(--bg) 8px,var(--bg) 16px);display:grid;place-items:center;color:var(--faint);font-size:11px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.nd .img img{width:100%;height:100%;object-fit:cover;display:block}
.nd.t-ref{width:200px}
.nd.t-hub{border-color:var(--text)}
.nd.sel{box-shadow:0 0 0 2px var(--text)}
.cv-tools{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:6px;z-index:2;flex-wrap:wrap;pointer-events:none}
.cv-tools>*{pointer-events:auto}
.cv-zoom{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;z-index:2;font-size:12px;color:var(--muted)}
.mini{position:absolute;right:12px;bottom:12px;width:180px;height:112px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;z-index:2}
.mini i{position:absolute;background:var(--line2);border-radius:2px}
.mini b{position:absolute;border:1.5px solid var(--text);border-radius:2px}
/* Доска решений */
.bd-node{margin-bottom:20px;padding:22px}
.bd-node .bh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.bd-node .lead{color:var(--muted);font-size:13px;margin:4px 0 0}
.bd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.bd-item{overflow:hidden;display:flex;flex-direction:column}
.bd-item .shot{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,var(--side),var(--side) 8px,var(--bg) 8px,var(--bg) 16px);display:grid;place-items:center;color:var(--faint);font-size:12px;border-bottom:1px solid var(--line);text-align:center;padding:10px}
.bd-item .shot.tall{aspect-ratio:3/4}
.bd-item .b{padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.bd-item .b .t div:last-child{font-size:12px;color:var(--faint)}
.verd{display:flex;gap:4px;flex-wrap:wrap}
.verd button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px;cursor:pointer;font-size:12px;color:var(--muted)}
.verd button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.bd-foot{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.rbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line2);background:var(--panel);cursor:pointer;font-size:16px;flex:none}
.rbtn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.lab{font:11px/1 ui-monospace,Consolas,monospace;color:var(--faint);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.varsw{display:flex;gap:4px;margin-top:12px}
/* Документы: конструктор */
.ed{display:grid;grid-template-columns:220px minmax(0,1fr) 260px;gap:16px;align-items:start}
.ed .side-p{padding:12px;position:sticky;top:16px}
.blk{display:flex;gap:6px;align-items:center;padding:6px 6px;border-radius:5px;font-size:13px}
.blk:hover{background:var(--hover)}
.blk .h{color:var(--faint);cursor:grab}
.blk .t{flex:1}
.blk button{border:0;background:none;color:var(--faint);cursor:pointer;padding:0 3px}
.blk button:hover{color:var(--text)}
.a4{background:#fff;color:#1c1c1b;max-width:640px;min-height:900px;margin:0 auto;padding:56px 60px;box-shadow:var(--sh);border-radius:2px;font-size:13px;line-height:1.6}
.a4 h4{font-size:13px;margin:18px 0 6px}
.a4 p{margin:0 0 8px}
.a4[contenteditable="true"]{outline:2px dashed #9a9a95;outline-offset:6px}
.var{background:#ececea;border:1px dashed #b5b5b0;border-radius:4px;padding:0 4px;white-space:nowrap}
.var.ok{border-style:solid;background:#f4f4f3}

const effDate=x=>{const d=D(x.date);return !x.done&&d<TODAY?TODAY:d};
function planCalc(pid){
  const pl=plans[pid];if(!pl||!okDate(pl.start))return null;
  const sum=pl.stages.reduce((a,s)=>a+(+s[1]||0),0),lag=pl.stages.reduce((a,s)=>a+(+s[2]||0),0);
  if(!sum)return null;
  const n=sum+lag,days=workDays(D(pl.start),n);let pi=0,fi=0;
  const st=pl.stages.map(([name,d,l])=>{d=+d||0;l=+l||0;const r={name,d,lag:l,ps:pi,fs:fi};pi+=d;fi+=d+l;return r});
  const ti=days.findIndex(x=>F(x)===TODAY_S);
  return {pl,days,st,n,ti,sum,lag,endPlan:days[sum-1],endFact:days[n-1],cur:st.findIndex(s=>ti>=s.fs&&ti<s.fs+s.d+s.lag)};
}

/* --- Холст --- */
function cvDefault(p){
  const nodes=[],edges=[];
  nodes.push({id:'passport',type:'hub',k:'Паспорт',t:p.name,b:p.what,x:40,y:60,go:'overview'});
  const st=p.steps.filter(s=>s.st!=='skip');
  st.forEach((s,i)=>{const row=Math.floor(i/4),c=i%4,col=row%2?3-c:c;
    nodes.push({id:'s'+i,type:'step',k:'Шаг '+s.n,t:s.name,b:ST[s.st].i+' '+ST[s.st].t+(s.note?' · '+s.note:''),x:330+col*260,y:40+row*190,go:'overview'});
    edges.push([i?'s'+(i-1):'passport','s'+i]);});
  const ci=st.findIndex(s=>s.name==='Концепт'), di=st.findIndex(s=>s.name.startsWith('Дизайн-система'));
  const refL=p.links.find(l=>l[0]==='Референсы');
  let y=40+Math.ceil(st.length/4)*190+30;
  if(refL)refL[1].split(',').map(x=>x.trim()).forEach((r,i)=>{nodes.push({id:'ref'+i,type:'ref',k:'Референс',t:r,img:'скриншот',x:330+i*230,y});edges.push(['ref'+i,'s'+(di>=0?di:0)])});
  if(p.rounds.length){const r=p.rounds[0];nodes.push({id:'edits',type:'edit',k:'Правки',t:'Раунд '+r.n+' · '+r.date,b:(r.rows.length-roundOpen(r))+' из '+r.rows.length+' закрыто',x:40,y:300,go:'edits'});if(ci>=0)edges.push(['s'+ci,'edits'])}
  if(boards[p.id]){nodes.push({id:'board',type:'edit',k:'Доска',t:'Доска решений',b:bcountOf(p)+' узлов ждут пометок',x:40,y:460,go:'board'});if(ci>=0)edges.push(['board','s'+ci])}
  return {nodes,edges,tx:0,ty:0,z:1,sel:null,linking:false,linkFrom:null,filter:'all',fitted:false};
}

function cvApply(){const c=cvState(P(S.pid)),inn=$('#cv-in');if(!inn)return;inn.style.transform=`translate(${c.tx}px,${c.ty}px) scale(${c.z})`;$('#cv-z').textContent=Math.round(c.z*100)+'%';cvMini()}
function cvBox(c,id){const el=document.querySelector(`[data-nd="${id}"]`),n=c.nodes.find(n=>n.id===id);if(!el||!n||el.style.display==='none')return null;return {x:n.x,y:n.y,w:el.offsetWidth,h:el.offsetHeight}}
function cvEdges(){
  const c=cvState(P(S.pid)),svg=$('#cv-svg');if(!svg)return;
  svg.innerHTML=c.edges.map(([a,b])=>{const A=cvBox(c,a),B=cvBox(c,b);if(!A||!B)return '';
    const ax=A.x+A.w/2,ay=A.y+A.h/2,bx=B.x+B.w/2,by=B.y+B.h/2;let x1,y1,x2,y2,d;
    if(Math.abs(bx-ax)>Math.abs(by-ay)){x1=bx>ax?A.x+A.w:A.x;x2=bx>ax?B.x:B.x+B.w;y1=ay;y2=by;const k=(x2-x1)/2;d=`M${x1} ${y1}C${x1+k} ${y1},${x2-k} ${y2},${x2} ${y2}`}
    else{y1=by>ay?A.y+A.h:A.y;y2=by>ay?B.y:B.y+B.h;x1=ax;x2=bx;const k=(y2-y1)/2;d=`M${x1} ${y1}C${x1} ${y1+k},${x2} ${y2-k},${x2} ${y2}`}
    return `<path d="${d}" style="fill:none;stroke:var(--line2);stroke-width:1.5"/><circle cx="${x2}" cy="${y2}" r="3.5" style="fill:var(--muted)"/>`}).join('');
}
function cvBounds(c){const el=$('#cv');let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;c.nodes.filter(n=>cvVis(c,n)).forEach(n=>{const b=cvBox(c,n.id)||{x:n.x,y:n.y,w:220,h:100};x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)});return x0>x1?null:{x0,y0,x1,y1,el}}
function cvFit(){const c=cvState(P(S.pid)),b=cvBounds(c);if(!b)return;const W=b.el.clientWidth,H=b.el.clientHeight,pad=60;
  c.z=Math.min(1.2,Math.max(.3,Math.min((W-pad*2)/(b.x1-b.x0),(H-pad*2-40)/(b.y1-b.y0))));c.tx=(W-(b.x1-b.x0)*c.z)/2-b.x0*c.z;c.ty=(H-(b.y1-b.y0)*c.z)/2-b.y0*c.z+16;cvApply()}
function cvMini(){
  const m=$('#mini'),c=cvState(P(S.pid)),b=cvBounds(c);if(!m||!b)return;
  const W=b.el.clientWidth,H=b.el.clientHeight,vx=-c.tx/c.z,vy=-c.ty/c.z,vw=W/c.z,vh=H/c.z;

/* ---------- События ---------- */
function bind(){
  document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();go(e.dataset.nav)});
  document.querySelectorAll('[data-proj]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('[data-done]'))return;go('project',e.dataset.proj,e.dataset.tab)});
  document.querySelectorAll('[data-kb]').forEach(e=>e.onclick=()=>{S.kbedit=false;go('kb',e.dataset.kb)});
  document.querySelectorAll('[data-done]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const id=e.dataset.done;S.todayDone[id]=!S.todayDone[id];if(id.startsWith('t-')){const t=tasks.find(t=>'t-'+t.id===id);if(t)t.done=S.todayDone[id]}render()});
  document.querySelectorAll('[data-task]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('[data-done]'))return;const t=todayTasks().find(t=>t.id===e.dataset.task);t&&t.go()});
  document.querySelectorAll('[data-pf]').forEach(e=>e.onclick=()=>{S.pfilter=e.dataset.pf;render()});
  document.querySelectorAll('[data-ql]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();toast('Открыть: '+e.dataset.ql+' → '+e.title)});
  document.querySelectorAll('[data-pmode]').forEach(e=>e.onclick=()=>{S.pmode=e.dataset.pmode;render()});
  document.querySelectorAll('[data-ptab]').forEach(e=>e.onclick=()=>{S.ptab=e.dataset.ptab;render()});
  document.querySelectorAll('[data-round]').forEach(e=>e.onclick=()=>{const n=+e.dataset.round;S.openRounds[n]=!(S.openRounds[n]??false);render()});
  document.querySelectorAll('[data-step]').forEach(e=>e.onchange=()=>{
    const p=P(S.pid),i=+e.dataset.step;p.steps[i].st=e.value;let n=0;
    for(let j=i+1;j<p.steps.length;j++)if(['done','work'].includes(p.steps[j].st)){p.steps[j].st='old';n++}
    render();
    for(let j=i+1;j<p.steps.length;j++)if(p.steps[j].st==='old')document.getElementById('step-'+j)?.classList.add('flash');
    toast(n?`Шаг «${p.steps[i].name}» изменён · ${n} шаг(а) ниже помечены ⚠️ Устарело · записано в PROJECT.md`:`Шаг «${p.steps[i].name}» → ${ST[e.value].t} · записано в PROJECT.md`);
  });
  document.querySelectorAll('[data-edit]').forEach(e=>e.onchange=()=>{const [rn,i]=e.dataset.edit.split(':').map(Number);P(S.pid).rounds.find(r=>r.n===rn).rows[i][2]=e.value;render();toast('Статус правки сохранён в edits/round-'+rn+'.md')});
  document.querySelectorAll('[data-send]').forEach(e=>e.onclick=()=>{P(S.pid).rounds.find(r=>r.n===+e.dataset.send).sent=true;render();toast('Раунд отмечен «отправлен клиенту»')});
  document.querySelectorAll('[data-newround]').forEach(e=>e.onclick=()=>{const p=P(S.pid),n=(p.rounds[0]?.n||0)+1;p.rounds.unshift({n,date:TODAY_S,source:'— укажи источник —',sent:false,rows:[]});S.openRounds[n]=true;render();toast(`Раунд ${n} создан. Скинь правки в чат — Claude разнесёт их по строкам`)});
  document.querySelectorAll('[data-pstatus]').forEach(e=>e.onchange=()=>{P(S.pid).status=e.value;toast('Статус проекта: '+PSTATUS[e.value])});
  document.querySelectorAll('[data-kbedit]').forEach(e=>e.onclick=()=>{if(S.kbedit){let cur;kb.forEach(g=>g.items.forEach(i=>{if(i.id===S.kbid)cur=i}));cur.body=document.querySelector('.page .body').innerHTML;toast('Сохранено в файл')}S.kbedit=!S.kbedit;render()});
  document.querySelectorAll('[data-rf]').forEach(e=>e.onclick=()=>{S.refFilter=e.dataset.rf;render()});
  document.querySelectorAll('[data-mark]').forEach(e=>e.onclick=()=>{const [id,m]=e.dataset.mark.split(':');const r=refs.find(r=>r.id===+id);r.mark=r.mark===m?'':m;render()});
  document.querySelectorAll('[data-iproj]').forEach(e=>e.onchange=()=>{inbox.find(i=>i.id===+e.dataset.iproj).proj=e.value});
  document.querySelectorAll('[data-itype]').forEach(e=>e.onchange=()=>{inbox.find(i=>i.id===+e.dataset.itype).type=e.value});
  document.querySelectorAll('[data-sort]').forEach(e=>e.onclick=()=>{const k=inbox.findIndex(i=>i.id===+e.dataset.sort),it=inbox[k];inbox.splice(k,1);render();toast(`«${it.type}» → ${it.proj?P(it.proj).name:'без проекта'}`)});
  document.querySelectorAll('[data-new]').forEach(e=>e.onclick=()=>openNew(e.dataset.new||'Заметка'));
  document.querySelectorAll('[data-newproj]').forEach(e=>e.onclick=()=>toast('Новый проект: выбрать тип (Figma / Tilda / приложение / пресейл) → пайплайн подставится сам'));
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(e=>e[ev]=x=>fn(e,x));
  on('[data-toast]','onclick',e=>toast(e.dataset.toast));
  on('[data-pdf]','onclick',(e,x)=>{x.stopPropagation();toast('«'+e.dataset.pdf+'» → PDF сохранён в Downloads')});
  on('[data-anchor]','onclick',e=>document.getElementById(e.dataset.anchor)?.scrollIntoView({behavior:'smooth',block:'start'}));
  on('[data-doc]','onclick',e=>go('doc',e.dataset.doc));
  on('[data-dtab]','onclick',e=>{S.doctab=e.dataset.dtab;render()});
  on('[data-mtab]','onclick',e=>{S.mtab=e.dataset.mtab;render()});
  on('[data-wk]','onclick',e=>{const k=+e.dataset.wk;S.wk=k?S.wk+k:0;render()});
  on('[data-paid]','onclick',e=>{payments[+e.dataset.paid].paid=true;render();toast('Платёж отмечен — статистика обновилась')});
  on('[data-newclient]','onclick',()=>{$('#ov-client').classList.add('on');$('#cl-name').focus()});
  on('[data-taste]','onclick',e=>{const [i,v]=e.dataset.taste.split(':');S.taste[i]=S.taste[i]===v?'':v;render()});
  /* холст */
  on('[data-cv]','onclick',e=>cvAction(e.dataset.cv));
  on('[data-cvf]','onclick',e=>{cvState(P(S.pid)).filter=e.dataset.cvf;render()});
  /* доска решений */
  on('[data-bst]','onclick',e=>{S.bstage=e.dataset.bst;render()});
  on('[data-bv]','onclick',e=>{const [id,i,v]=e.dataset.bv.split(':');const it=bnode(id).items[+i];it.v=it.v===v?'':v;render()});
  on('[data-bnote]','onchange',e=>{const [id,i]=e.dataset.bnote.split(':');bnode(id).items[+i].note=e.value});
  on('[data-bfix]','onchange',e=>{bnode(e.dataset.bfix).fix=e.value});
  on('[data-bpick]','onclick',e=>{const [id,k]=e.dataset.bpick.split(':');const n=bnode(id);n.pick=n.pick===k?'':k;render()});
  on('[data-bok]','onclick',e=>{const [id,v]=e.dataset.bok.split(':'),n=bnode(id),p=P(S.pid);
    if(n.ok===v){n.ok='';render();return}
    if(v==='no'&&!n.fix){document.querySelector(`[data-bfix="${id}"]`).focus();toast('Напиши, что поправить — Claude переделает по пометке');return}
    n.ok=v;if(v==='ok'){p.decisions.unshift([TODAY_S,'Доска: '+n.title+(n.pick?' — вариант '+n.pick:'')+(n.fix?' ('+n.fix+')':'')]);toast('Принято · решение записано в паспорт')}else toast('На переделку · пометка уйдёт Claude');render()});
  on('[data-bsend]','onclick',()=>{const all=Object.values(boards[S.pid]||{}).flat(),m=all.filter(n=>n.ok).length;toast(`Пометки записаны в projects/${S.pid}/board/${S.bstage}.json (${m} из ${all.length} узлов решено). Claude Code заберёт их и продолжит`)});
  /* план */
  on('[data-mkplan]','onclick',()=>{const p=P(S.pid);plans[p.id]={start:TODAY_S,tpl:TYPES[p.type],total:'',stages:p.steps.filter(s=>!['done','skip'].includes(s.st)).map(s=>[s.name,'',0])};S.planEdit=true;render()});
  on('[data-pedit]','onclick',()=>{S.planEdit=true;render()});
  on('[data-pdone]','onclick',()=>{S.planEdit=false;render();toast('План сохранён в PROJECT.md')});
  on('[data-pd]','onchange',e=>{plans[S.pid].stages[+e.dataset.pd][1]=e.value;render()});
  on('[data-pstart]','onchange',e=>{if(okDate(e.value.trim())){plans[S.pid].start=e.value.trim();render()}else toast('Дата в формате ДД.ММ')});
  on('[data-ptotal]','onchange',e=>{plans[S.pid].total=e.value;render()});
  on('[data-shift]','onclick',()=>{const n=Math.max(1,+$('#shiftN').value||1),pc=planCalc(S.pid);if(!pc)return;const i=pc.cur>=0?pc.cur:pc.st.findIndex(s=>s.fs>pc.ti);if(i<0){toast('Все этапы уже позади');return}
    plans[S.pid].stages[i][2]=(+plans[S.pid].stages[i][2]||0)+n;render();toast(`Этап «${pc.st[i].name}» +${n} дн. из-за ожидания клиента · сдача → ${F(planCalc(S.pid).endFact)}`)});
  on('[data-tdone]','onclick',e=>{const t=tasks.find(t=>t.id===+e.dataset.tdone);t.done=!t.done;render()});
  on('[data-tadd]','onclick',()=>{const tx=$('[data-ttext]').value.trim(),dt=$('[data-tdate]').value.trim();if(!tx){$('[data-ttext]').focus();return}if(!okDate(dt)){toast('Дата в формате ДД.ММ');return}
    tasks.push({id:Date.now(),pid:S.pid,step:$('[data-tstep]').value,text:tx,date:dt,done:false,moved:0});render();toast(dt===TODAY_S?'Задача добавлена — она в «Делах на сегодня»':'Задача добавлена на '+dt)});
  /* документы */
  on('[data-mkdoc]','onchange',e=>{if(!e.value)return;const p=P(S.pid),t=TPL.find(x=>x.id===e.value),id='d'+Date.now();docs.push({id,pid:p.id,tpl:t.id,t:t.k+' — '+p.name,st:'Черновик',ver:1,date:TODAY_S});go('doc',id)});
  on('[data-dv]','onchange',e=>{docVals(S.docid)[e.dataset.dv]=e.value;delete S.dochtml[S.docid];render()});
  on('[data-bmv]','onclick',e=>{const [i,d]=e.dataset.bmv.split(':').map(Number),b=S.docblocks[S.docid],j=i+d;if(j<0||j>=b.length)return;[b[i],b[j]]=[b[j],b[i]];delete S.dochtml[S.docid];render()});
  on('[data-bdel]','onclick',e=>{S.docblocks[S.docid].splice(+e.dataset.bdel,1);delete S.dochtml[S.docid];render()});
  on('[data-badd]','onchange',e=>{if(!e.value)return;S.docblocks[S.docid].push(e.value);delete S.dochtml[S.docid];render()});
  on('[data-docedit]','onclick',()=>{if(S.docedit){S.dochtml[S.docid]=$('.a4').innerHTML;const d=docs.find(x=>x.id===S.docid);if(d)d.ver++;toast(d?'Текст сохранён · новая версия v'+d.ver:'Шаблон сохранён — изменится во всех новых документах')}S.docedit=!S.docedit;render()});
  /* КП */
  on('[data-kpf]','onchange',e=>{kps[S.pid][e.dataset.kpf]=e.value;render()});
  on('[data-kps]','onchange',e=>{const [i,f]=e.dataset.kps.split(':');kps[S.pid].stages[+i][f]=e.value;render()});
  on('[data-kpc]','onchange',e=>{kps[S.pid].cases[+e.dataset.kpc]=e.value});
  on('[data-kpadd]','onclick',()=>{kps[S.pid].stages.push({n:'Новый этап',desc:'',res:'',days:'',price:''});render()});
  on('[data-kpst]','onchange',e=>{const k=kps[S.pid];k.status=e.value;k.hist.unshift(['v'+(k.hist.length+1),TODAY_S,KPST[e.value]]);render();toast('Статус КП: '+KPST[e.value])});
  on('[data-mkkp]','onclick',()=>{const p=P(S.pid);kps[p.id]={status:'draft',what:p.what,pages:'',date:TODAY_S,until:'',start:'',task:'',pay:'50/50',stages:[{n:'Этап 1',desc:'',res:'',days:'',price:''}],cases:['','',''],hist:[['v1',TODAY_S,'Черновик']]};render()});
  on('[data-kpaccept]','onclick',()=>{const p=P(S.pid),k=kps[p.id];
    if(k.stages.some(s=>!num(s.days))||!okDate(k.start)){toast('Заполни старт и дни всех этапов — из них соберутся договор и план');return}
    k.status='accepted';k.hist.unshift(['v'+(k.hist.length+1),TODAY_S,'Принято']);
    plans[p.id]={start:k.start,tpl:'Из КП',total:k.stages.reduce((a,s)=>a+num(s.days),0),stages:k.stages.map(s=>[s.n,num(s.days),0])};
    const id='d'+Date.now();docs.push({id,pid:p.id,tpl:'tpl-dog-tilda',t:'Договор — '+p.name,st:'Черновик',ver:1,date:TODAY_S});
    S.docv[id]={'Номер':'','Город':'','Дата':TODAY_S,'Клиент':p.client,'Что делаем':k.what,'Срок':k.stages.reduce((a,s)=>a+num(s.days),0)+' раб. дней','Сумма':money(k.stages.reduce((a,s)=>a+num(s.price),0)),'Схема оплаты':k.pay};
    render();toast('КП принято → создан договор с теми же этапами и суммами и план проекта по этапам')});
}
document.querySelectorAll('.sbtn[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

/* ---------- Поиск Ctrl+K ---------- */
let qi=0, qitems=[];
function openSearch(){$('#ov-search').classList.add('on');$('#q').value='';qi=0;runQ();$('#q').focus()}
function runQ(){
  const q=$('#q').value.trim().toLowerCase();const m=s=>!q||s.toLowerCase().includes(q);
  const g=[];
  projects.filter(p=>m(p.name+' '+p.client)).forEach(p=>g.push(['Проекты',p.name,TYPES[p.type],()=>go('project',p.id)]));
  projects.forEach(p=>p.rounds.forEach(r=>r.rows.forEach(x=>{if(q&&m(x[0]+' '+x[1]))g.push(['Правки',x[1],p.name+' · раунд '+r.n,()=>go('project',p.id,'edits')])})));
  kb.forEach(gr=>gr.items.forEach(i=>{if(m(i.t)||(q&&m(i.body)))g.push(['База знаний',i.t,gr.g,()=>go('kb',i.id)])}));
  refs.filter(r=>q&&m(r.name+' '+r.why)).forEach(r=>g.push(['Референсы',r.name,r.why,()=>go('refs')]));
  tasks.filter(t=>q&&m(t.text)).forEach(t=>g.push(['Задачи',t.text,P(t.pid).name+' · '+t.date,()=>go('project',t.pid,'plan')]));
  docs.filter(d=>m(d.t)).forEach(d=>g.push(['Документы',d.t,d.st,()=>go('doc',d.id)]));
  qitems=g.slice(0,30);if(qi>=qitems.length)qi=0;
  let last='';$('#qres').innerHTML=qitems.map((x,i)=>{const h=x[0]!==last?`<div class="g">${x[0]}</div>`:'';last=x[0];return h+`<div class="r ${i===qi?'sel':''}" data-qi="${i}"><span>${esc(x[1])}</span><span class="m">${esc(x[2])}</span></div>`}).join('')||'<div class="mres"><div class="g">Ничего не нашлось</div></div>';
  document.querySelectorAll('[data-qi]').forEach(e=>e.onclick=()=>{closeOv();qitems[+e.dataset.qi][3]()});
}
$('#q').oninput=()=>{qi=0;runQ()};
$('#q').onkeydown=e=>{if(e.key==='ArrowDown'){qi=Math.min(qi+1,qitems.length-1);runQ();e.preventDefault()}if(e.key==='ArrowUp'){qi=Math.max(qi-1,0);runQ();e.preventDefault()}if(e.key==='Enter'&&qitems[qi]){closeOv();qitems[qi][3]()}};

/* ---------- Создание Ctrl+N ---------- */
let newType='Заметка';
function openNew(t){newType=t||'Заметка';$('#new-type').innerHTML=['Заметка','Правка','Референс','Задача'].map(x=>`<button class="fbtn ${x===newType?'on':''}" data-nt="${x}">${x}</button>`).join('');document.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>openNew(b.dataset.nt));$('#ov-new').classList.add('on');$('#new-text').focus()}
$('#new-save').onclick=()=>{const t=$('#new-text').value.trim();if(!t){$('#new-text').focus();return}inbox.unshift({id:Date.now(),kind:newType==='Референс'?'Ссылка':'Заметка',text:t,meta:'Ctrl+N · только что',proj:S.view==='project'?S.pid:'',type:newType});$('#new-text').value='';closeOv();render();toast('Сохранено во Входящие')};
function closeOv(){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'))}
document.querySelectorAll('.ov').forEach(o=>o.onclick=e=>{if(e.target===o||e.target.hasAttribute('data-close'))closeOv()});
$('#cl-parse').onclick=()=>toast('Реквизиты переданы Claude Code — поля заполнятся после разбора');
$('#cl-save').onclick=()=>{const n=$('#cl-name').value.trim();if(!n){$('#cl-name').focus();return}clients.unshift({name:n,pid:''});closeOv();document.querySelectorAll('#ov-client input,#ov-client textarea').forEach(i=>i.value='');S.mtab='clients';render();toast('Клиент сохранён')};
$('#b-search').onclick=openSearch;$('#b-new').onclick=()=>openNew();
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&(k==='k'||k==='л')){e.preventDefault();openSearch()}
  if((e.ctrlKey||e.metaKey)&&(k==='n'||k==='т')){e.preventDefault();openNew()}
  if(e.key==='Escape')closeOv();
  if(e.key==='Delete'&&S.view==='project'&&S.ptab==='canvas'&&!e.target.closest('input,textarea')){const c=cvState(P(S.pid));if(c.sel){c.nodes=c.nodes.filter(n=>n.id!==c.sel);c.edges=c.edges.filter(x=>!x.includes(c.sel));c.sel=null;render();toast('Окно убрано с холста')}}
});

/* ---------- Тема и симуляция автообновления ---------- */
$('#b-theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('#b-theme').textContent=d?'Тёмная тема':'Светлая тема'};
$('#b-sim').onclick=()=>{
  const p=P('nordline'),r=p.rounds[0],i=r.rows.findIndex(x=>x[2]==='wait');
  if(i<0){toast('Все правки уже закрыты');return}
  r.rows[i][2]='done';r.rows[i][3]='Claude внёс правку из чата';
  $('#last-upd').textContent='Claude обновил файлы только что';
  render();toast(`Claude изменил projects/nordline/edits/round-3.md → «${r.rows[i][0]}» сделано. Экран обновился сам`);
};

render();
</script>
</body>
